# 后端依赖：PostgreSQL 16 + Redis 7
# 凭据/端口与 youlai-fastapi 的 .env 对齐（host 改为 localhost 后由本地容器提供）
services:
  postgres:
    image: postgres:16
    container_name: youlai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: youlai
      POSTGRES_PASSWORD: Youlai@2026
      POSTGRES_DB: youlai_admin
      TZ: Asia/Shanghai
    ports:
      - "15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U youlai -d youlai_admin"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - youlai-net

  redis:
    image: redis:7
    container_name: youlai-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "123456", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "123456", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - youlai-net

volumes:
  pgdata:
  redisdata:

networks:
  youlai-net:
    driver: bridge
